name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to validate
        required: true
      trigger_mode:
        description: Manual dispatch review trigger mode; pull_request runs post the selected backend trigger before waiting
        required: false
        default: skip

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number || github.ref }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: AI Review
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout gate scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.event.repository.default_branch }}

      - name: Check trusted gate script availability
        id: gate_scripts
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          for path in scripts/resolve-pr-context.mjs scripts/ai-review-gate.mjs; do
            if [ ! -f "$path" ]; then
              missing+=("$path")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "missing=$(IFS=,; echo "${missing[*]}")" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap compatibility notice
        if: steps.gate_scripts.outputs.available != 'true'
        run: |
          echo "::notice::Skipping AI review gate because gate scripts are not yet present on the selected checkout ref: ${{ steps.gate_scripts.outputs.missing }}."
          echo "::notice::This is expected for the first bootstrap PR. After merge, AI Review runs normally."

      - name: Resolve PR context
        if: steps.gate_scripts.outputs.available == 'true'
        id: pr
        run: node scripts/resolve-pr-context.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.AI_REVIEW_GITHUB_TOKEN || github.token }}
          AI_REVIEW_PR_NUMBER: ${{ inputs.pr_number }}

      - name: Resolve selected review policy
        if: steps.gate_scripts.outputs.available == 'true'
        id: policy
        shell: bash
        env:
          SELECTED_AGENT: ${{ vars.AI_REVIEW_AGENT }}
          REQUESTED_TRIGGER_MODE: ${{ inputs.trigger_mode }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          REPOSITORY: ${{ github.repository }}
          HAS_AI_REVIEW_GITHUB_TOKEN: ${{ secrets.AI_REVIEW_GITHUB_TOKEN != '' }}
        run: |
          set -euo pipefail
          selected="${SELECTED_AGENT:-codex}"
          selected="${selected:-codex}"
          case "$selected" in
            codex|claude|gemini) ;;
            *)
              echo "::error::Unsupported AI_REVIEW_AGENT value: '$selected'. Allowed: codex, claude, gemini."
              exit 1
              ;;
          esac
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            trigger_mode="${REQUESTED_TRIGGER_MODE:-skip}"
          elif [ "${PR_HEAD_REPOSITORY}" = "${REPOSITORY}" ] && [ "${HAS_AI_REVIEW_GITHUB_TOKEN}" = "true" ]; then
            trigger_mode="comment"
          else
            trigger_mode="skip"
          fi
          case "$trigger_mode" in
            skip|comment) ;;
            *)
              echo "::error::Unsupported AI_REVIEW_TRIGGER_MODE value: '$trigger_mode'. Allowed: skip, comment."
              exit 1
              ;;
          esac
          echo "selected_agent=$selected" >> "$GITHUB_OUTPUT"
          echo "trigger_mode=$trigger_mode" >> "$GITHUB_OUTPUT"

      - name: Route and validate selected native review
        if: steps.gate_scripts.outputs.available == 'true'
        run: node scripts/ai-review-gate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.AI_REVIEW_GITHUB_TOKEN || github.token }}
          AI_REVIEW_AGENT: ${{ steps.policy.outputs.selected_agent }}
          AI_REVIEW_PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          AI_REVIEW_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          AI_REVIEW_TRIGGER_MODE: ${{ steps.policy.outputs.trigger_mode }}
          AI_REVIEW_WAIT_MS: "1200000"
          AI_REVIEW_POLL_MS: "15000"
