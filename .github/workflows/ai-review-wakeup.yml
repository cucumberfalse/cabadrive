name: AI Review Wakeup

on:
  issue_comment:
    types: [created, edited, deleted]
  workflow_run:
    workflows: [AI Review, AI Review Native Signal]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: write

jobs:
  context:
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      pr_number: ${{ steps.pr.outputs.pr_number }}
      pr_matrix: ${{ steps.pr.outputs.pr_matrix }}
      has_prs: ${{ steps.pr.outputs.has_prs }}
    if: |
      github.event_name == 'workflow_run' || github.event_name == 'schedule' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       (github.event.action == 'edited' || github.event.action == 'deleted' ||
        contains(github.event.comment.body, 'Codex Review:') ||
        contains(github.event.comment.body, '<!-- codex-review-receipt:') ||
        contains(github.event.comment.body, '<!-- codex-pull-request-review-summary') ||
        contains(github.event.comment.body, '<!-- codex-review-state:')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted context resolver
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Resolve independently verified PR association
        id: pr
        run: node scripts/ai-review-wakeup.mjs --resolve-only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_AGENT: ${{ vars.AI_REVIEW_AGENT }}
  wakeup:
    needs: context
    if: needs.context.outputs.has_prs == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pull: ${{ fromJSON(needs.context.outputs.pr_matrix) }}
    concurrency:
      group: ai-review-wakeup-${{ matrix.pull.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted wakeup scripts
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile native review signal with exact-head gate
        run: node scripts/ai-review-wakeup.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AI_REVIEW_AGENT: ${{ vars.AI_REVIEW_AGENT }}
          AI_REVIEW_PR_NUMBER: ${{ matrix.pull.number }}
          AI_REVIEW_HEAD_SHA: ${{ matrix.pull.head_sha }}
