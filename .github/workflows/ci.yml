name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-checks:
    name: baseline-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Detect pnpm lockfile
        id: lockfile
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node (with pnpm cache)
        if: steps.lockfile.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Node (without cache)
        if: steps.lockfile.outputs.present != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Run repository baseline
        run: pnpm run check:repo

      - name: Run typecheck and lint with budget
        env:
          QUALITY_FAST_BUDGET_SECONDS: "60"
          QUALITY_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          if [[ ! "$QUALITY_SOURCE_HEAD" =~ ^[0-9a-f]{40}$ ]]; then
            echo "quality:fast source head is not a full SHA: $QUALITY_SOURCE_HEAD" >&2
            exit 1
          fi
          start=$(date +%s)
          pnpm run quality:fast
          elapsed=$(($(date +%s) - start))
          echo "quality:fast completed in ${elapsed}s (budget ${QUALITY_FAST_BUDGET_SECONDS}s, source ${QUALITY_SOURCE_HEAD})"
          if (( elapsed > QUALITY_FAST_BUDGET_SECONDS )); then
            echo "quality:fast exceeded the ${QUALITY_FAST_BUDGET_SECONDS}s budget" >&2
            exit 1
          fi

      - name: Run format check
        run: pnpm run format:check

      - name: Run negative quality contracts
        run: pnpm run verify:quality-negative

      - name: Run tests if present
        run: pnpm run --if-present test

      - name: Run build if present
        run: pnpm run --if-present build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser smoke tests if present
        run: pnpm run --if-present test:e2e

  docker-validation:
    name: docker-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build Docker image
        run: make build

      - name: Start Docker app
        run: make up

      - name: Smoke test local app
        env:
          CABADRIVE_HOST_PORT: "5173"
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://localhost:${CABADRIVE_HOST_PORT}/" >/tmp/cabadrive-home.html; then
              break
            fi
            sleep 1
          done
          grep -q "Cabadrive" /tmp/cabadrive-home.html
          curl --fail --silent --show-error "http://localhost:${CABADRIVE_HOST_PORT}/sw.js" >/dev/null

      - name: Stop Docker app
        if: always()
        run: make down
