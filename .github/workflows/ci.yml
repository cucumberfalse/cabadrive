name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline-checks:
    name: baseline-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Detect pnpm lockfile
        id: lockfile
        shell: bash
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node (with pnpm cache)
        if: steps.lockfile.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup Node (without cache)
        if: steps.lockfile.outputs.present != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Run repository baseline
        run: pnpm run check:repo

      - name: Run tests if present
        run: pnpm run --if-present test

      - name: Run build if present
        run: pnpm run --if-present build

  docker-validation:
    name: docker-validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build Docker image
        run: make build

      - name: Start Docker app
        run: make up

      - name: Smoke test local app
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:5173/ >/tmp/cabadrive-home.html; then
              break
            fi
            sleep 1
          done
          grep -q "Cabadrive" /tmp/cabadrive-home.html
          curl --fail --silent --show-error http://localhost:5173/sw.js >/dev/null

      - name: Stop Docker app
        if: always()
        run: make down
