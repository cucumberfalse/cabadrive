server {
  listen 8080;
  server_name _;
  root /state/current;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    alias /state/assets/;
    try_files $uri =404;
  }

  location /content/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
}
